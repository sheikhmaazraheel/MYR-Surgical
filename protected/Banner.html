<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://www.myrsurgical.com/favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://www.myrsurgical.com/favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="https://www.myrsurgical.com/favicon_io/favicon-16x16.png"
    />
    <link
      rel="manifest"
      href="https://www.myrsurgical.com/favicon_io/site.webmanifest"
    />
    <link
      rel="shortcut icon"
      href="https://www.myrsurgical.com/favicon_io/favicon.ico"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <nav class="top-nav">
      <img src="https://www.myrsurgical.com/images/logo.jpeg" alt="logo" />
    </nav>
    <button class="hamburger">☰</button>
    <nav class="sidebar">
      <ul>
        <li>
          <a href="https://www.myrsurgical.com/protected/admin">HOME</a>
        </li>
        <li>
          <a href="https://www.myrsurgical.com/protected/Product-add"
            >Add Products</a
          >
        </li>
        <li>
          <a href="https://www.myrsurgical.com/protected/Product-edit"
            >Edit or Delete Products</a
          >
        </li>
        <li>
          <a href="https://www.myrsurgical.com/protected/Banner">Banner</a>
        </li>
        <li>
          <a href="https://www.myrsurgical.com/protected/Orders">Orders</a>
        </li>
      </ul>
    </nav>

    <main class="main-content" style="text-align: center">
      <h1>Admin Panel – Banner Management</h1>
      <form id="bannerForm">
        <label for="image">Banner Image</label>
        <input type="file" id="image" name="image" required />

        <label for="url">Clickable URL (optional)</label>
        <input type="text" id="url" name="url" />

        <label for="startDate">Start Date</label>
        <input type="date" name="startDate" />
        <label for="endDate">End Date(optional)</label>
        <input type="date" name="endDate" />
        <div id="upload-status"></div>
        <button type="submit">Upload Banner</button>
      </form>
      <button id="logout-btn">Logout</button>
      <div id="bannerList"></div>
    </main>
    <script src="https://www.myrsurgical.com/admin.js"></script>
  </body>
</html>
